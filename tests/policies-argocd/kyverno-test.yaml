# The rule of platform/policies/lab-argocd.yaml only applies to what Argo CD's application controller writes:
# this test runs as that service account (scripts/check.sh, step 4). The kyverno CLI counts a resource a rule does
# not match as passing; scripts/check-policy-tests.py is what makes a refusal expected here fail when its rule
# was not evaluated, a wrong service account name in the policy included. The DELETE side of the rules cannot be
# run by the CLI: it was checked on a cluster, by impersonating the account.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lab-argocd
policies:
- ../../platform/policies/lab-argocd.yaml
resources:
- resources.yaml
userinfo: userinfo.yaml
results:
- policy: lab-argocd
  rule: argo-cd-writes-the-apps-objects-only
  kind: Secret
  resources:
  - mine-lab/mine-lab
  result: pass
- policy: lab-argocd
  rule: argo-cd-writes-the-apps-objects-only
  kind: Secret
  resources:
  - mine-lab/mine-lab-app
  result: fail
- policy: lab-argocd
  rule: argo-cd-writes-the-apps-objects-only
  kind: Secret
  resources:
  - other-lab/other-lab
  result: fail
- policy: lab-argocd
  rule: argo-cd-writes-the-apps-objects-only
  kind: Secret
  resources:
  - untracked-lab/untracked-lab
  result: fail
- policy: lab-argocd
  rule: argo-cd-writes-the-apps-objects-only
  kind: ConfigMap
  resources:
  - rootca-lab/kube-root-ca.crt
  result: fail
- policy: lab-argocd
  rule: argo-cd-tracks-no-lab-namespace
  kind: Namespace
  resources:
  - created-lab
  result: pass
- policy: lab-argocd
  rule: argo-cd-tracks-no-lab-namespace
  kind: Namespace
  resources:
  - victim-lab
  result: fail
