          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: secrets
          mountPath: /secrets
          readOnly: true
      volumes:
      - name: secrets
        projected:
          sources:
          - secret:
              name: projtoken-lab
          - serviceAccountToken:
              path: token
