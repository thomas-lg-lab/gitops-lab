# Fixtures for kyverno test: one good app (hello-lab) and one violation per namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-lab
  namespace: hello-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-lab
  template:
    metadata:
      labels:
        app: hello-lab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: ghcr.io/thomas-lg-lab/hello:edge@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: hello-lab
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hello-lab
  namespace: hello-lab
spec:
  type: ClusterIP
  selector:
    app: hello-lab
  ports:
  - port: 8080
    targetPort: 8080
---
