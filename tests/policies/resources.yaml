  namespace: label-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: label-lab
  template:
    metadata:
      labels:
        app: label-lab
        cnpg.io/cluster: label-lab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: docker.io/library/nginx:latest
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
