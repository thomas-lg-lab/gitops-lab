# ---- The database variant.
# A database as an app declares it (database/cluster.yaml).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hello-lab
  namespace: hello-lab
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
---
# The same Cluster as admission sees it, with the operator's defaults filled in (operator 1.30.1; refresh it
# from `kubectl apply --dry-run=server` when the operator is upgraded).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dbdefault-lab
  namespace: dbdefault-lab
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  storage:
    size: 1Gi
    resizeInUseVolumes: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  affinity:
    podAntiAffinityType: preferred
  bootstrap:
    initdb:
      database: app
      encoding: UTF8
      localeCType: C
      localeCollate: C
      owner: app
  enablePDB: true
  enableSuperuserAccess: false
  failoverDelay: 0
  logLevel: info
  maxSyncReplicas: 0
  minSyncReplicas: 0
  monitoring:
    customQueriesConfigMap:
    - key: queries
      name: cnpg-default-monitoring
    disableDefaultQueries: false
    enablePodMonitor: false
  postgresGID: 26
  postgresUID: 26
  postgresql:
    parameters:
      archive_mode: 'on'
      wal_level: logical
      shared_preload_libraries: ''
    syncReplicaElectionConstraint:
      enabled: false
  primaryUpdateMethod: restart
  primaryUpdateStrategy: unsupervised
  probes:
    liveness:
      isolationCheck:
        connectionTimeout: 1000
        enabled: true
        requestTimeout: 1000
  replicationSlots:
    highAvailability:
      enabled: true
      slotPrefix: _cnpg_
    synchronizeReplicas:
      enabled: true
    updateInterval: 30
  smartShutdownTimeout: 180
  startDelay: 3600
  stopDelay: 1800
  switchoverDelay: 3600
---
# A pod of the PostgreSQL operator: the three app rules skip it, the rules of any pod still hold.
apiVersion: v1
kind: Pod
metadata:
  name: dbpod-lab-1
  namespace: dbpod-lab
  labels:
    cnpg.io/cluster: dbpod-lab
    cnpg.io/podRole: instance
spec:
  serviceAccountName: dbpod-lab
  securityContext:
    runAsNonRoot: true
    runAsUser: 26
    seccompProfile:
      type: RuntimeDefault
  initContainers:
  - name: bootstrap-controller
    image: ghcr.io/cloudnative-pg/cloudnative-pg:1.30.1
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
  containers:
  - name: postgres
    image: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    readinessProbe:
      httpGet:
        path: /readyz
        port: 8000
        scheme: HTTPS
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
  volumes:
  - name: pgdata
    persistentVolumeClaim:
      claimName: dbpod-lab-1
  - name: scratch-data
    emptyDir: {}
  - name: kube-api-access
    projected:
      sources:
      - serviceAccountToken:
          path: token
---
