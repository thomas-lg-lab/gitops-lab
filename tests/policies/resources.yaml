# ---- Scheduling is left to the cluster, and an app's pods mount no service account token.
# A pod as Kubernetes completes it (its two default tolerations, the default scheduler): accepted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sched-lab
  namespace: sched-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sched-lab
  template:
    metadata:
      labels:
        app: sched-lab
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: ghcr.io/thomas-lg-lab/hello:edge@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: secrets
        secret:
          secretName: sched-lab
      schedulerName: default-scheduler
      tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
---
