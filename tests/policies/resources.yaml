# ---- What an app's pods may mount: its own volume and secret, and its database's connection secret.
# The database's volume, the operator's certificates as a volume, projected, or as environment: refused.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mountdb-lab
  namespace: mountdb-lab
spec:
  selector:
    matchLabels:
      app: mountdb-lab
  template:
    metadata:
      labels:
        app: mountdb-lab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: ghcr.io/thomas-lg-lab/hello:edge@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: secrets
        secret:
          secretName: mountdb-lab
      - name: pgdata
        persistentVolumeClaim:
          claimName: mountdb-lab-1
