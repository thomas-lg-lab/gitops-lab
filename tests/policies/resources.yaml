# A database as an app declares it (database/cluster.yaml).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hello-lab
  namespace: hello-lab
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
---
# The same Cluster as admission sees it, with the operator's defaults filled in.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dbdefault-lab
  namespace: dbdefault-lab
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  storage:
    size: 1Gi
    resizeInUseVolumes: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  affinity:
    podAntiAffinityType: preferred
  bootstrap:
    initdb:
      database: app
      encoding: UTF8
      localeCType: C
      localeCollate: C
      owner: app
  enablePDB: true
  enableSuperuserAccess: false
  failoverDelay: 0
  logLevel: info
  maxSyncReplicas: 0
  minSyncReplicas: 0
  monitoring:
    customQueriesConfigMap:
    - key: queries
      name: cnpg-default-monitoring
    disableDefaultQueries: false
    enablePodMonitor: false
  postgresGID: 26
  postgresUID: 26
  postgresql:
    parameters:
      archive_mode: 'on'
      wal_level: logical
      shared_preload_libraries: ''
    syncReplicaElectionConstraint:
      enabled: false
  primaryUpdateMethod: restart
  primaryUpdateStrategy: unsupervised
  probes:
    liveness:
      isolationCheck:
        connectionTimeout: 1000
        enabled: true
        requestTimeout: 1000
  replicationSlots:
    highAvailability:
      enabled: true
      slotPrefix: _cnpg_
    synchronizeReplicas:
      enabled: true
    updateInterval: 30
  smartShutdownTimeout: 180
  startDelay: 3600
  stopDelay: 1800
  switchoverDelay: 3600
---
# A pod of the PostgreSQL operator: not an app pod, the app rules skip it.
apiVersion: v1
kind: Pod
metadata:
  name: dbpod-lab-1
  namespace: dbpod-lab
  labels:
    cnpg.io/cluster: dbpod-lab
    cnpg.io/podRole: instance
spec:
  serviceAccountName: dbpod-lab
  containers:
  - name: postgres
    image: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    readinessProbe:
      httpGet:
        path: /readyz
        port: 8000
        scheme: HTTPS
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
  volumes:
  - name: pgdata
    persistentVolumeClaim:
      claimName: dbpod-lab-1
  - name: kube-api-access
    projected:
      sources:
      - serviceAccountToken:
          path: token
---
# An app wearing the operator's label to escape the app rules.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: label-lab
  namespace: label-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: label-lab
  template:
    metadata:
      labels:
        app: label-lab
        cnpg.io/cluster: label-lab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: docker.io/library/nginx:latest
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: secrets
          mountPath: /secrets
          readOnly: true
      volumes:
      - name: secrets
        secret:
          secretName: label-lab
---
# /secrets as a projected volume of secrets: the app's own and its database's.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: projsecret-lab
  namespace: projsecret-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: projsecret-lab
  template:
    metadata:
      labels:
        app: projsecret-lab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: ghcr.io/thomas-lg-lab/hello:edge@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: secrets
          mountPath: /secrets
          readOnly: true
      volumes:
      - name: secrets
        projected:
          sources:
          - secret:
              name: projsecret-lab
          - secret:
              name: projsecret-lab-app
              items:
              - key: uri
                path: database-url
---
# A projected volume may not carry a service account token.
apiVersion: apps/v1
kind: Deployment
metadata:
