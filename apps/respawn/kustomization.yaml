# Overlay of respawn, written by scripts/new-app.sh. Renovate updates the digest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: respawn-lab
namePrefix: respawn-
labels:
  - pairs:
      app.kubernetes.io/name: respawn
      lab: "true"
    includeSelectors: true
    includeTemplates: true
resources:
  - ../../base
  - ../../database
generators:
  - secret-generator.yaml
images:
  - name: app
    newName: ghcr.io/thomas-lg-lab/respawn
    newTag: edge@sha256:eaefc1728231e26f0cba386c6b382a5f3e57b08b52f1036c261a9771b4da9041
patches:
  - target:
      kind: Deployment
      name: lab
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: lab
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: LAB_PUBLIC_URL
                    valueFrom:
                      configMapKeyRef:
                        name: lab-settings
                        key: public-url
                  - name: LAB_TRUSTED_PROXIES
                    valueFrom:
                      configMapKeyRef:
                        name: lab-settings
                        key: trusted-proxies
                  - name: LAB_OIDC_ISSUER
                    valueFrom:
                      configMapKeyRef:
                        name: lab-settings
                        key: oidc-issuer
                  - name: RESPAWN_PUBLIC_URL
                    value: '$(LAB_PUBLIC_URL)'
                  - name: RESPAWN_TRUSTED_PROXIES
                    value: '$(LAB_TRUSTED_PROXIES)'
                  - name: RESPAWN_OIDC_PROVIDERS
                    value: '[{"name":"sso","label":"SSO","issuer":"$(LAB_OIDC_ISSUER)","client_id":"respawn-lab","create_accounts":true}]'
            volumes:
              - name: secrets
                secret: null
                projected:
                  sources:
                    - secret:
                        name: lab
                    - secret:
                        name: respawn-lab-app
                        items:
                          - key: uri
                            path: database-url
