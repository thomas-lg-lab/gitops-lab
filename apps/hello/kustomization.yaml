# Overlay of hello, written by scripts/new-app.sh. Renovate updates the digest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hello-lab
namePrefix: hello-
labels:
  - pairs:
      app.kubernetes.io/name: hello
      lab: "true"
    includeSelectors: true
    includeTemplates: true
resources:
  - ../../base
generators:
  - secret-generator.yaml
images:
  - name: app
    newName: ghcr.io/thomas-lg-lab/hello
    newTag: edge@sha256:53783762305b9ee34193da08dfa43ebb664c753d208af1e74aeca7ce232925b0
