# Overlay of hello, written by scripts/new-app.sh. Renovate updates the digest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hello-lab
namePrefix: hello-
labels:
  - pairs:
      app.kubernetes.io/name: hello
      lab: "true"
    includeSelectors: true
    includeTemplates: true
resources:
  - ../../base
generators:
  - secret-generator.yaml
images:
  - name: app
    newName: ghcr.io/thomas-lg-lab/hello
    newTag: edge@sha256:539f3e93e8e844d566c621b6b095afba0fb9afb7081f4ee4f7be6146921a3e3f
