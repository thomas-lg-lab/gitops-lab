# Overlay of hello, written by scripts/new-app.sh. Renovate updates the digest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hello-lab
namePrefix: hello-
labels:
  - pairs:
      app.kubernetes.io/name: hello
      lab: "true"
    includeSelectors: true
    includeTemplates: true
resources:
  - ../../base
generators:
  - secret-generator.yaml
images:
  - name: app
    newName: ghcr.io/thomas-lg-lab/hello
    newTag: edge@sha256:871702eef7824961629181dc99155e8615d0df59df5939120eb631556be6b8d6
