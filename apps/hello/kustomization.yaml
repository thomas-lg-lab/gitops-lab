# Overlay of hello, written by scripts/new-app.sh. Renovate updates the digest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hello-lab
namePrefix: hello-
labels:
  - pairs:
      app.kubernetes.io/name: hello
      lab: "true"
    includeSelectors: true
    includeTemplates: true
resources:
  - ../../base
generators:
  - secret-generator.yaml
images:
  - name: app
    newName: ghcr.io/thomas-lg-lab/hello
    newTag: edge@sha256:864629ba26f31223ab099e45b00fa61e38b0eb19f94cf9b1ba8042d785769af0
