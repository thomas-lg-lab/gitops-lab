# Overlay of hello, written by scripts/new-app.sh. Renovate updates the digest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hello-lab
namePrefix: hello-
labels:
  - pairs:
      app.kubernetes.io/name: hello
      lab: "true"
    includeSelectors: true
    includeTemplates: true
resources:
  - ../../base
generators:
  - secret-generator.yaml
images:
  - name: app
    newName: ghcr.io/thomas-lg-lab/hello
    newTag: edge@sha256:0a72e7c589a955ad3bd13efc45b60cc16aa7bdb2e020c6bebc491f36cb9be412
