# Read-only access for an automation agent. The ServiceAccount's long-lived token goes into the agent's kubeconfig:
# the built-in `view` role in every *-lab namespace (RoleBinding generated by lab-namespace-defaults: pods, logs,
# events, deployments; no secrets, no exec), read on Argo CD's Applications, and nodes and namespaces.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-access
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-view
  namespace: lab-access
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-view-token
  namespace: lab-access
  annotations:
    kubernetes.io/service-account.name: agent-view
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-view-cluster
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-view-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-view-cluster
subjects:
  - kind: ServiceAccount
    name: agent-view
    namespace: lab-access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-view-applications
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-view-applications
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-view-applications
subjects:
  - kind: ServiceAccount
    name: agent-view
    namespace: lab-access
