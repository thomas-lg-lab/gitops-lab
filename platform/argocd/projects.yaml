# Two projects. `platform` is everything only the code owners change (CODEOWNERS): Argo CD, Kyverno, the
# PostgreSQL operator, the policies, the read-only access. `lab` is what the ApplicationSet deploys from apps/*: this
# repository only, namespaces *-lab only, and only the namespaced kinds an app needs. Ingress, NetworkPolicy,
# ResourceQuota, LimitRange and RoleBinding are generated by Kyverno, so an app cannot bring its own.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
spec:
  description: Argo CD, Kyverno, the PostgreSQL operator, the policies and the read-only access (code owners only)
  sourceRepos:
    - https://github.com/thomas-lg-lab/gitops-lab.git
    - https://kyverno.github.io/kyverno/
    - https://cloudnative-pg.github.io/charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lab
spec:
  description: Lab apps generated from apps/*
  sourceRepos:
    - https://github.com/thomas-lg-lab/gitops-lab.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*-lab"
  # Namespace only so CreateNamespace can make <app>-lab. The destinations above do not bound a cluster-scoped
  # kind, so the name does, as far as a pattern goes: no namespace of the platform, but any *-lab name passes,
  # another app's included. A Namespace has no place in an overlay: scripts/check-overlay.py refuses one in a
  # rendered overlay, and platform/policies/lab-argocd.yaml refuses one Argo CD would track.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
      name: "*-lab"
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: Secret
    - group: ""
      kind: ConfigMap
    # The app's database: one Cluster, in the shape lab-databases.yaml allows.
    - group: postgresql.cnpg.io
      kind: Cluster
---
# Argo CD creates a `default` project that allows every source and destination. Nothing uses it: it is pinned here
# with nothing allowed, so an Application created in it by mistake cannot deploy anything.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
spec:
  description: Unused; nothing allowed (every Application belongs to platform or lab)
  sourceRepos: []
  destinations: []
  clusterResourceWhitelist: []
  namespaceResourceWhitelist: []
