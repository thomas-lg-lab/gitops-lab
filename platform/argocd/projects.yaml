# Two projects. `platform` is everything only the code owners change (CODEOWNERS): Argo CD, Kyverno, the policies,
# the agent's access. `lab` is what the ApplicationSet deploys from apps/*: this repository only, namespaces *-lab
# only, and only the namespaced kinds an app needs. Ingress, NetworkPolicy, ResourceQuota, LimitRange and
# RoleBinding are generated by Kyverno, so an app cannot bring its own.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
spec:
  description: Argo CD, Kyverno, the policies and the agent's access (code owners only)
  sourceRepos:
    - https://github.com/thomas-lg-lab/gitops-lab.git
    - https://kyverno.github.io/kyverno/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lab
spec:
  description: Lab apps generated from apps/*
  sourceRepos:
    - https://github.com/thomas-lg-lab/gitops-lab.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*-lab"
  # Namespace only so CreateNamespace can make <app>-lab; the destinations above still bound it to *-lab.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: Secret
    - group: ""
      kind: ConfigMap
---
# Argo CD creates a `default` project that allows every source and destination. Nothing uses it: it is pinned here
# with nothing allowed, so an Application created in it by mistake cannot deploy anything.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
spec:
  description: Unused; nothing allowed (every Application belongs to platform or lab)
  sourceRepos: []
  destinations: []
  clusterResourceWhitelist: []
  namespaceResourceWhitelist: []
