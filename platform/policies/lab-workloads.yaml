# What a lab app's pods may be: the runtime contract, enforced twice (CI and admission).
# Written for Pods: Kyverno's autogen applies the same rules to Deployments, so a bad Deployment is refused at
# admission and in CI (`kyverno apply` on the rendered overlays). Scope: namespaces *-lab only.
#
# The pods of an app's database are not app pods: the PostgreSQL operator derives them from a Cluster that
# lab-databases.yaml has validated, and marks them with the label cnpg.io/cluster. They keep the rules that hold
# for any pod (restricted pod security, read-only root filesystem, requests and a memory limit), so nothing set on
# a Cluster can turn them into privileged pods. The rules that describe an app (its image, its volumes and
# secrets, its /healthz probe) skip that label, and the last rule gives the database's pods their own image rule.
# The skip is a precondition, not an exclude: a selector in match or exclude would switch autogen off.
# lab-objects.yaml refuses the label on the workloads an app can declare, so an app cannot wear it to escape
# those rules.
#
# An app shares its namespace with its database, so its pods may only mount what is the app's: the volume and the
# secret named after the namespace, and the database's connection secret. Not the database's volume, nor the
# operator's certificates, nor a service account's token (the database's account is named like the app).
#
# The cluster is one node shared by every app and by the platform: an app does not choose where, or before whom,
# its pods run. A required anti-affinity over every namespace, or a system priority, would keep every other pod
# from starting. (That rule assumes no PriorityClass is the cluster's default: Kubernetes would then write its
# name into every pod. And a background scan, which reads a running pod as if it were being created, would report
# its node name: the reports controller is off on this cluster.)
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: lab-workloads
  annotations:
    policies.kyverno.io/title: Lab workloads
    policies.kyverno.io/description: Images, pod security, resources, volumes and probes of the lab apps.
spec:
  # Every rule already carries failureAction: Enforce; this policy-level field only makes `kubectl get cpol`
  # say the same thing.
  validationFailureAction: Enforce
  background: true
  rules:
    - name: images-from-the-organisation-by-digest
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["*-lab"]
      preconditions:
        all:
          - key: "{{ contains(keys(request.object.metadata.labels || `{}`), 'cnpg.io/cluster') }}"
            operator: Equals
            value: false
      validate:
        failureAction: Enforce
        message: "Images must be ghcr.io/thomas-lg-lab/<app>@sha256:<digest>."
        foreach:
          - list: "request.object.spec.[containers, initContainers][]"
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('^ghcr\\.io/thomas-lg-lab/[a-z0-9-]+(:[A-Za-z0-9._-]+)?@sha256:[a-f0-9]{64}$', element.image) }}"
                    operator: Equals
                    value: false
    - name: pod-security-restricted
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["*-lab"]
      validate:
        failureAction: Enforce
        podSecurity:
          level: restricted
          version: latest
    - name: read-only-root-filesystem
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["*-lab"]
      validate:
        failureAction: Enforce
        message: "Containers run with a read-only root filesystem (writes go to /data and /tmp)."
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: true
    - name: requests-and-memory-limit
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["*-lab"]
      validate:
        failureAction: Enforce
        message: "Containers set CPU and memory requests and a memory limit."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
    - name: volumes-pvc-secret-emptydir-only
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["*-lab"]
      preconditions:
        all:
          - key: "{{ contains(keys(request.object.metadata.labels || `{}`), 'cnpg.io/cluster') }}"
            operator: Equals
            value: false
      validate:
        failureAction: Enforce
        message: "Volumes are the app's own PVC, secrets (alone or projected together) and emptyDir only."
        deny:
          conditions:
            any:
              # The app's own volume, named after the namespace: not the database's.
              - key: "{{ request.object.spec.volumes[].persistentVolumeClaim.claimName || `[]` }}"
                operator: AnyNotIn
                value: ["{{ request.namespace }}"]
              - key: "{{ request.object.spec.volumes[?persistentVolumeClaim == null && secret == null && emptyDir == null && projected == null] || `[]` | length(@) }}"
                operator: GreaterThan
                value: 0
              # A projected volume only gathers secrets under one path: no service account token, no downward
              # API, no ConfigMap.
              - key: "{{ request.object.spec.volumes[].projected.sources[] | [?secret == null] || `[]` | length(@) }}"
                operator: GreaterThan
                value: 0
    - name: own-secrets-only
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["*-lab"]
      preconditions:
        all:
          - key: "{{ contains(keys(request.object.metadata.labels || `{}`), 'cnpg.io/cluster') }}"
            operator: Equals
            value: false
      validate:
        failureAction: Enforce
        message: "A pod reads the app's secret ({{ request.namespace }}) and its database's connection secret ({{ request.namespace }}-app) only, as volumes or as environment."
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.volumes[].secret.secretName || `[]` }}"
                operator: AnyNotIn
                value: ["{{ request.namespace }}", "{{ request.namespace }}-app"]
              - key: "{{ request.object.spec.volumes[].projected.sources[].secret.name || `[]` }}"
                operator: AnyNotIn
                value: ["{{ request.namespace }}", "{{ request.namespace }}-app"]
              - key: "{{ request.object.spec.[containers, initContainers][].env[].valueFrom.secretKeyRef.name || `[]` }}"
                operator: AnyNotIn
                value: ["{{ request.namespace }}", "{{ request.namespace }}-app"]
              - key: "{{ request.object.spec.[containers, initContainers][].envFrom[].secretRef.name || `[]` }}"
                operator: AnyNotIn
                value: ["{{ request.namespace }}", "{{ request.namespace }}-app"]
    - name: no-service-account-token
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["*-lab"]
              operations: [CREATE, UPDATE]
      preconditions:
        all:
          - key: "{{ contains(keys(request.object.metadata.labels || `{}`), 'cnpg.io/cluster') }}"
            operator: Equals
            value: false
      validate:
        failureAction: Enforce
        message: "A lab app's pods mount no service account token (automountServiceAccountToken: false)."
        pattern:
          spec:
            automountServiceAccountToken: false
    - name: scheduling-left-to-the-cluster
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["*-lab"]
              operations: [CREATE, UPDATE]
      preconditions:
        all:
          - key: "{{ contains(keys(request.object.metadata.labels || `{}`), 'cnpg.io/cluster') }}"
            operator: Equals
            value: false
      validate:
        failureAction: Enforce
        message: "A lab app does not choose where or before whom its pods run: no affinity, node name or selector, toleration, priority class, topology spread or scheduler."
        deny:
          conditions:
            any:
              - key: "{{ keys(request.object.spec || `{}`) }}"
                operator: AnyIn
                value: [affinity, nodeSelector, priorityClassName, topologySpreadConstraints]
              # On a Pod the node's name is refused at creation only: the scheduler writes it afterwards, and a
              # later update of the pod (a label, a finalizer) carries it. On a Deployment (autogen) it is refused
              # at any time.
              - key: "{{ (request.object.kind != 'Pod' || request.operation == 'CREATE') && (request.object.spec.nodeName || '') != '' }}"
                operator: Equals
                value: true
              - key: "{{ request.object.spec.schedulerName || 'default-scheduler' }}"
                operator: NotEquals
                value: default-scheduler
              # Kubernetes adds two tolerations to every pod (node not ready, node unreachable): those only.
              - key: "{{ request.object.spec.tolerations[?!(key == 'node.kubernetes.io/not-ready' || key == 'node.kubernetes.io/unreachable') || operator != 'Exists' || effect != 'NoExecute'] || `[]` | length(@) }}"
                operator: GreaterThan
                value: 0
    - name: readiness-on-healthz
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["*-lab"]
      preconditions:
        all:
          - key: "{{ contains(keys(request.object.metadata.labels || `{}`), 'cnpg.io/cluster') }}"
            operator: Equals
            value: false
      validate:
        failureAction: Enforce
        message: "The app container has a readiness probe on GET /healthz, port 8080."
        pattern:
          spec:
            containers:
              - readinessProbe:
                  httpGet:
                    path: /healthz
                    port: 8080
    - name: database-pods-run-the-operator-images
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["*-lab"]
      preconditions:
        all:
          - key: "{{ contains(keys(request.object.metadata.labels || `{}`), 'cnpg.io/cluster') }}"
            operator: Equals
            value: true
      validate:
        failureAction: Enforce
        message: "The pods of a database run images of ghcr.io/cloudnative-pg only (PostgreSQL and the operator)."
        foreach:
          - list: "request.object.spec.[containers, initContainers][]"
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('^ghcr\\.io/cloudnative-pg/(postgresql|cloudnative-pg)[:@]', element.image) }}"
                    operator: Equals
                    value: false
