# Names, Secrets and Service of a lab app, and the namespaces themselves. In the namespace <app>-lab every object
# the app declares is named <app>-lab (its database too), its Secret is a plain one and the Service is internal on
# 8080. Apps bring no Ingress: lab-namespace-defaults generates the only one, from the site settings.
#
# What the PostgreSQL operator creates for an app's database (Services on 5432, Secrets, a PVC, each named after
# the Cluster) is not judged here: those requests come from the operator's own service account, which no app can
# use. The operator's labels are refused on any other workload, and so are ConfigMaps under its names.
#
# By default Kyverno lets an update through when the object already broke the rule, and the operator's objects do
# break the app rules by design. That tolerance is needed: Kubernetes' own controllers update those objects too
# (a volume's finalizer, for one), and refusing them leaves a namespace that cannot be deleted. But it would also
# let an app rewrite or remove the operator's objects once they exist (the database's connection secret, its
# Services): lab-argocd.yaml holds Argo CD, the only writer acting for an app, to the app's own objects with no
# such tolerance. The operator's ConfigMap rule has no tolerance either, nothing else writes those.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: lab-objects
  annotations:
    policies.kyverno.io/title: Lab objects
    policies.kyverno.io/description: Names, Secrets, Service and Ingress of the lab apps, the operator's labels and ConfigMaps, the label of the lab namespaces.
spec:
  # Every rule already carries failureAction: Enforce; this policy-level field only makes `kubectl get cpol`
  # say the same thing.
  validationFailureAction: Enforce
  background: false
  rules:
    - name: named-after-the-namespace
      match:
        any:
          - resources:
              kinds: [Deployment, Service, PersistentVolumeClaim, Secret, postgresql.cnpg.io/v1/Cluster]
              namespaces: ["*-lab"]
              # Not DELETE: an admin may remove an object of the operator (deleting the database's connection
              # secret is how its password is rotated).
              operations: [CREATE, UPDATE]
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: cloudnative-pg
                namespace: cnpg-system
      validate:
        failureAction: Enforce
        message: "Objects of {{ request.namespace }} are named {{ request.namespace }}."
        deny:
          conditions:
            any:
              - key: "{{ request.object.metadata.name }}"
                operator: NotEquals
                value: "{{ request.namespace }}"
    # A Secret of a type Kubernetes fills in by itself is not a plain secret: one of type service-account-token
    # would receive a token of the account it names, the database's included.
    - name: app-secrets-are-opaque
      match:
        any:
          - resources:
              kinds: [Secret]
              namespaces: ["*-lab"]
              operations: [CREATE, UPDATE]
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: cloudnative-pg
                namespace: cnpg-system
      validate:
        failureAction: Enforce
        message: "The Secret of a lab app is of type Opaque."
        deny:
          conditions:
            any:
              - key: "{{ request.object.type || 'Opaque' }}"
                operator: NotEquals
                value: Opaque
    # The label lab=true is what gives a namespace its Ingress, NetworkPolicies and quota: every *-lab namespace
    # carries it, and no other namespace does.
    - name: lab-label-on-lab-namespaces-only
      match:
        any:
          - resources:
              kinds: [Namespace]
              operations: [CREATE, UPDATE]
      validate:
        failureAction: Enforce
        message: "The label lab=true is on the namespaces named *-lab, on all of them and on no other."
        deny:
          conditions:
            any:
              - key: "{{ (request.object.metadata.labels.lab || '') == 'true' }}"
                operator: NotEquals
                value: "{{ ends_with(request.object.metadata.name, '-lab') }}"
    - name: app-name-not-ending-in-lab
      match:
        any:
          - resources:
              kinds: [Namespace]
              names: ["*-lab"]
      validate:
        failureAction: Enforce
        message: "The app name must not end in -lab (the namespace would be <app>-lab-lab)."
        deny:
          conditions:
            any:
              - key: "{{ ends_with(request.object.metadata.name, '-lab-lab') }}"
                operator: Equals
                value: true
    - name: service-internal-on-8080
      match:
        any:
          - resources:
              kinds: [Service]
              namespaces: ["*-lab"]
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: cloudnative-pg
                namespace: cnpg-system
      validate:
        failureAction: Enforce
        message: "The Service is ClusterIP with one port 8080 to targetPort 8080, and no external address."
        pattern:
          spec:
            =(type): ClusterIP
            X(externalIPs): "null"
            ports:
              - port: 8080
                targetPort: 8080
    - name: no-ingress-from-apps
      match:
        any:
          - resources:
              kinds: [Ingress]
              namespaces: ["*-lab"]
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: kyverno-background-controller
                namespace: kyverno
      validate:
        failureAction: Enforce
        message: "A lab app brings no Ingress: the platform generates <namespace>.<domain> for it."
        deny: {}
    # lab-workloads treats the pods labelled cnpg.io/cluster as database pods and the generated network rules open
    # the database's ports and the Kubernetes API to them: only the operator may create a workload carrying a
    # label of its domain. The key is tested, not its value: an empty label still matches a selector. Workloads
    # only: the lab project lets an app declare no other kind that makes pods.
    - name: operator-label-from-the-operator-only
      match:
        any:
          - resources:
              kinds: [Deployment, StatefulSet, DaemonSet, ReplicaSet, Job]
              namespaces: ["*-lab"]
              operations: [CREATE, UPDATE]
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: cloudnative-pg
                namespace: cnpg-system
      validate:
        failureAction: Enforce
        message: "Labels of cnpg.io belong to the PostgreSQL operator."
        deny:
          conditions:
            any:
              - key: "{{ keys(request.object.metadata.labels || `{}`)[?contains(@, 'cnpg.io')] | length(@) }}"
                operator: GreaterThan
                value: 0
              - key: "{{ keys(request.object.spec.template.metadata.labels || `{}`)[?contains(@, 'cnpg.io')] | length(@) }}"
                operator: GreaterThan
                value: 0
    # The operator keeps the monitoring queries of a database in a ConfigMap of the namespace, and runs them inside
    # the database: an app may not bring a ConfigMap under the operator's names.
    - name: operator-configmaps-from-the-operator-only
      match:
        any:
          - resources:
              kinds: [ConfigMap]
              names: ["cnpg-*"]
              namespaces: ["*-lab"]
              operations: [CREATE, UPDATE]
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: cloudnative-pg
                namespace: cnpg-system
      validate:
        failureAction: Enforce
        allowExistingViolations: false
        message: "ConfigMaps named cnpg-* belong to the PostgreSQL operator."
        deny: {}
