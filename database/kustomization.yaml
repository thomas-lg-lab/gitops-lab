# The one database shape of a lab app: a single-instance PostgreSQL Cluster, run by the CloudNativePG operator in
# the app's own namespace. An overlay written by `scripts/new-app.sh --database` adds this folder to its resources;
# namePrefix makes the Cluster `<app>-lab`, so the operator writes the connection secret `<app>-lab-app` there,
# and the overlay mounts its `uri` key as /secrets/database-url. platform/policies/lab-databases.yaml states what
# a Cluster may be.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cluster.yaml
