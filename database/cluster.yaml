# PostgreSQL 18 from the operator's project ("standard" image: pgvector and pgaudit included), pinned by digest;
# Renovate follows the tag (renovate.json). Database `app`, owner `app`: the operator's defaults.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lab
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie@sha256:1abcfd1cac6d53cda5185706819aab36d66a4ed88e99fc2ae44ab0826aa99f00
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
