# PostgreSQL 18 from the operator's project ("standard" image: pgvector and pgaudit included), pinned by digest;
# Renovate follows the tag (renovate.json). Database `app`, owner `app`: the operator's defaults.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lab
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie@sha256:23719505c7cc417b043ffd9998b44ab8d57fec1d92f0bf11b231a1754a5962f2
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
